<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem API Key - Modern</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #f0f2f5; 
            color: #333; 
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .container { width: 100%; max-width: 500px; padding: 20px; }
        .card { 
            background: white; padding: 40px; border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(112, 0, 255, 0.1); text-align: center;
        }
        .logo { font-size: 3rem; margin-bottom: 10px; color: #6c63ff; }
        h2 { margin: 10px 0 30px; color: #2d3436; font-weight: 600; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; color: #636e72; font-size: 0.9rem; }
        input { 
            width: 100%; padding: 12px 15px; border: 2px solid #f1f2f6; 
            border-radius: 8px; font-family: inherit; transition: 0.3s; background: #fcfcfc;
        }
        input:focus { border-color: #6c63ff; outline: none; background: white; }
        button { 
            width: 100%; padding: 14px; margin-top: 10px; border: none; 
            border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; transition: 0.3s;
        }
        .btn-primary { background: #6c63ff; color: white; box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3); }
        .btn-primary:hover { background: #5a52d5; transform: translateY(-2px); }
        .switch-link { margin-top: 20px; font-size: 0.85rem; color: #888; }
        .switch-link span { color: #6c63ff; cursor: pointer; font-weight: 600; text-decoration: underline; }
        .hidden { display: none; }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        textarea {
            width: 100%; background: #f8f9fa; border: 1px dashed #6c63ff;
            padding: 15px; border-radius: 8px; color: #6c63ff; font-weight: bold;
            font-family: monospace; margin-top: 15px; resize: none; height: auto;
        }
    </style>
</head>
<body>

<div class="container">

    <div id="section-user" class="card">
        <div class="logo">🚀</div>
        <h2>Dapatkan API Key</h2>
        
        <div class="row">
            <div class="col form-group">
                <label>Nama Depan</label>
                <input type="text" id="firstName" placeholder="John">
            </div>
            <div class="col form-group">
                <label>Nama Belakang</label>
                <input type="text" id="lastName" placeholder="Doe">
            </div>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="email@kamu.com">
        </div>

        <button class="btn-primary" onclick="saveUser()">Generate Key</button>

        <div id="resultArea" class="hidden">
            <label style="margin-top: 15px; text-align: left;">API Key Anda:</label>
            <textarea id="resultKey" readonly></textarea>
        </div>

        <div class="switch-link">
            Admin Panel? <span onclick="switchView('login')">Login Disini</span>
        </div>
    </div>

    <div id="section-login" class="card hidden">
        <div class="logo">🔐</div>
        <h2>Admin Login</h2>
        <div class="form-group">
            <label>Email Admin</label>
            <input type="email" id="loginEmail" placeholder="admin@system.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPass" placeholder="••••••">
        </div>
        <button class="btn-primary" onclick="loginAdmin()">Masuk Dashboard</button>
        <div class="switch-link">
            Belum punya akun admin? <span onclick="switchView('register')">Daftar</span><br><br>
            <span onclick="switchView('user')">← Kembali ke User</span>
        </div>
    </div>

    <div id="section-register" class="card hidden">
        <div class="logo">🛡️</div>
        <h2>Buat Admin Baru</h2>
        <div class="form-group">
            <label>Email Admin Baru</label>
            <input type="email" id="newAdminEmail">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="newAdminPass">
        </div>
        <button class="btn-primary" onclick="createAdmin()">Daftar Admin</button>
        <div class="switch-link">
            Sudah punya akun? <span onclick="switchView('login')">Login Sekarang</span>
        </div>
    </div>

</div>

<script>
    function switchView(viewName) {
        document.getElementById('section-user').classList.add('hidden');
        document.getElementById('section-login').classList.add('hidden');
        document.getElementById('section-register').classList.add('hidden');

        if(viewName === 'user') document.getElementById('section-user').classList.remove('hidden');
        if(viewName === 'login') document.getElementById('section-login').classList.remove('hidden');
        if(viewName === 'register') document.getElementById('section-register').classList.remove('hidden');
    }

    async function saveUser() {
        const firstName = document.getElementById('firstName').value;
        const lastName = document.getElementById('lastName').value;
        const email = document.getElementById('email').value;

        if (!firstName || !email) return alert("Nama dan Email wajib diisi!");

        try {
            const res = await fetch('/generate-api-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ firstName, lastName, email }) 
            });

            const data = await res.json();

            if (res.ok) {
                document.getElementById("resultKey").value = data.apiKey;
                document.getElementById("resultArea").classList.remove('hidden');
                alert("Sukses! Key tersimpan.");
            } else {
                alert("Gagal: " + data.error);
            }

        } catch (err) {
            console.error(err);
            alert("Error koneksi server. Pastikan server jalan!");
        }
    }

    async function createAdmin() {
        const email = document.getElementById('newAdminEmail').value;
        const password = document.getElementById('newAdminPass').value;
        const res = await fetch('/admin/create', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        alert(data.message || data.error);
    }

    async function loginAdmin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPass').value;
        const res = await fetch('/admin/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.status === 'success') {
             window.location.href = "/admin_dashboard.html"; 
        } else {
            alert("❌ Gagal: " + data.message);
        }
    }
</script>

</body>
</html>
